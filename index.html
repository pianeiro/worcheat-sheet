<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorCheat Sheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="app.js" defer></script>
</head>
<body class="bg-gray-950 text-gray-200 font-sans antialiased h-full">
<div id="app" class="flex flex-col h-full">
  <header class="h-14 flex items-center px-5 bg-gray-900 border-b border-gray-700 shrink-0">
    <h1 class="text-lg font-semibold text-green-500 tracking-tight">WorCheat Sheet</h1>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <aside class="w-64 bg-gray-900 border-r border-gray-700 flex flex-col shrink-0 overflow-hidden" id="sidebar">
      <div class="px-5 py-4 text-xs font-semibold uppercase tracking-widest text-gray-400 border-b border-gray-700 flex items-center gap-2">
        <button id="backBtn" class="hidden items-center justify-center p-1 rounded hover:bg-gray-800 text-gray-200" title="Back to artists">&larr;</button>
        <span id="sidebarTitle">Artists</span>
      </div>
      <div class="flex-1 overflow-y-auto py-2" id="sidebarList"></div>
    </aside>

    <main class="flex-1 overflow-y-auto px-10 py-8 flex flex-col items-center" id="main">
      <div class="text-center mt-20" id="welcome">
        <h2 class="text-3xl font-semibold mb-2 text-gray-100">Your music scores</h2>
        <p class="text-gray-400 text-base">Select an artist from the sidebar to browse their pieces.</p>
      </div>

      <div class="w-full max-w-3xl hidden" id="scoreView">
        <div class="text-center mb-5">
          <h2 class="text-2xl font-semibold text-gray-100" id="scoreTitle"></h2>
          <p class="text-gray-400 text-sm mt-1" id="scoreArtist"></p>
        </div>
        <div id="scoreContent"></div>
      </div>
    </main>
  </div>

  <footer class="h-10 flex items-center justify-center text-xs text-gray-400 border-t border-gray-700 shrink-0">
    WorCheat Sheet &mdash; powered by LilyPond &amp; Hacklily
  </footer>
</div>
</body>
</html>
