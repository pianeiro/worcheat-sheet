<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorCheat Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    try {
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-bright": "#3a3939",
              "surface-container-lowest": "#0e0e0e",
              "surface-card": "#121212",
              "on-secondary-fixed": "#001f25",
              "on-background": "#e5e2e1",
              "on-primary": "#520071",
              "surface-dim": "#131313",
              "ncs-pink": "#FD80B6",
              "outline": "#9d8ba0",
              "on-primary-container": "#ffffff",
              "surface-glass": "rgba(25, 29, 36, 0.7)",
              "inverse-surface": "#e5e2e1",
              "surface-tint": "#ecb2ff",
              "on-primary-fixed-variant": "#74009f",
              "primary-fixed": "#f8d8ff",
              "on-error": "#690005",
              "inverse-primary": "#9900cf",
              "secondary-fixed": "#a5eeff",
              "secondary-fixed-dim": "#00daf8",
              "on-secondary": "#00363f",
              "on-secondary-fixed-variant": "#004e5a",
              "on-secondary-container": "#005f6d",
              "on-surface-variant": "#d4c0d7",
              "tertiary": "#ffb961",
              "surface-variant": "#353534",
              "secondary-container": "#00e0ff",
              "tertiary-container": "#a66800",
              "outline-variant": "#514255",
              "surface-container-low": "#1c1b1b",
              "surface-container-highest": "#353534",
              "on-tertiary-fixed-variant": "#663e00",
              "ncs-yellow": "#FFF605",
              "tertiary-fixed-dim": "#ffb961",
              "on-error-container": "#ffdad6",
              "error-container": "#93000a",
              "on-surface": "#e5e2e1",
              "surface-container": "#201f1f",
              "on-tertiary-fixed": "#2b1700",
              "on-tertiary": "#472a00",
              "primary-fixed-dim": "#ecb2ff",
              "surface-container-high": "#2a2a2a",
              "primary": "#ecb2ff",
              "surface": "#131313",
              "background": "#131313",
              "secondary": "#b9f1ff",
              "primary-container": "#bd00ff",
              "error": "#ffb4ab",
              "inverse-on-surface": "#313030",
              "on-tertiary-container": "#fffeff",
              "tertiary-fixed": "#ffddb9",
              "on-primary-fixed": "#320047"
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px"
            },
            spacing: {
              gutter: "24px",
              base: "8px",
              "stack-md": "24px",
              "margin-mobile": "16px",
              "container-max": "1440px",
              "stack-lg": "48px",
              "margin-desktop": "64px",
              "stack-sm": "12px"
            },
            fontFamily: {
              "label-caps": ["Montserrat"],
              "body-lg": ["Inter"],
              "headline-md": ["Montserrat"],
              "display-hero-mobile": ["Montserrat"],
              "track-title": ["Inter"],
              "body-md": ["Inter"],
              "display-hero": ["Montserrat"],
              "headline-lg": ["Montserrat"]
            },
            fontSize: {
              "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.1em", fontWeight: "800" }],
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
              "headline-md": ["24px", { lineHeight: "32px", fontWeight: "700" }],
              "display-hero-mobile": ["48px", { lineHeight: "52px", letterSpacing: "-0.02em", fontWeight: "900" }],
              "track-title": ["16px", { lineHeight: "20px", fontWeight: "600" }],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "display-hero": ["84px", { lineHeight: "90px", letterSpacing: "-0.04em", fontWeight: "900" }],
              "headline-lg": ["32px", { lineHeight: "40px", fontWeight: "700" }]
            }
          }
        }
      }
    } catch (_e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body class="bg-background text-on-surface font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container flex overflow-hidden h-screen">
  <div id="shell-outside"></div>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col h-screen overflow-y-auto relative">
    <div id="shell-inside-top"></div>

    <!-- Route Views -->
    <div id="main-content" class="flex-1">
    </div>

    <div id="shell-inside-bottom"></div>
  </main>


</body>
</html>
